name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: {}

# 防止同分支并发跑同一份 CI 浪费资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Show Python info
        run: |
          python --version
          pip --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Init test database (smoke check)
        env:
          DB_BACKEND: sqlite
          SQLITE_PATH: ${{ runner.temp }}/yuexin_smoke.db
        run: |
          python init_db.py
          python -c "import db; print('db backend ok:', db.get_backend())"

      - name: Run pytest
        env:
          PYTHONIOENCODING: utf-8
        run: |
          pytest -ra --tb=short --color=yes

      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: |
            .pytest_cache/**
            uvicorn.log.err
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.* pyflakes
          pip install -r requirements.txt

      - name: ruff check (non-blocking)
        # 项目当前未引入 ruff，先以 warning 模式跑，便于后续渐进治理
        continue-on-error: true
        run: ruff check .

      - name: pyflakes (must pass on key files)
        run: |
          pyflakes main.py audit.py db.py init_db.py config.py

      - name: Validate manifest.webmanifest is valid JSON
        run: python -c "import json,pathlib; json.loads(pathlib.Path('static/manifest.webmanifest').read_text(encoding='utf-8')); print('manifest ok')"

      - name: Validate sitemap.xml is well-formed
        run: python -c "import xml.etree.ElementTree as ET; ET.parse('static/sitemap.xml'); print('sitemap ok')"
