# ============================================================
# 悦心养生馆 - Nginx HTTP 反向代理（备案前用，备案后由 enable_https.sh 自动升级 HTTPS）
# 占位符：__SERVER_NAME__、__APP_PORT__ 由 install.sh 自动替换
# ============================================================

# 限流：每 IP 每秒最多 20 个请求（突发 40），与应用层互补
limit_req_zone $binary_remote_addr zone=yuexin_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    # 客户端最大上传体积（与应用层 5MB 图片限制对齐）
    client_max_body_size 8m;

    # 安全：隐藏版本
    server_tokens off;

    # gzip 压缩静态
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    access_log /var/log/nginx/yuexin.access.log;
    error_log  /var/log/nginx/yuexin.error.log warn;

    # ICP 备案验证文件目录（备案系统可能要求放一个验证 txt 在 /.well-known/）
    location /.well-known/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # 静态资源直接回源 FastAPI（也可改成 alias 直接由 nginx 出，进一步省 CPU）
    location /static/ {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 静态资源缓存（带文件名指纹的话可加大）
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
    }

    # API 加限流
    location /api/ {
        limit_req zone=yuexin_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # 兜底（首页 / robots.txt / sitemap.xml / manifest）
    location / {
        proxy_pass http://127.0.0.1:__APP_PORT__;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
